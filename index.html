<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated AI/ML Portfolio Development</title>
  <meta name="description"
    content="Portfolio of R. Gunasree, an AI & Data Innovator specializing in AI/ML, NLP, and data-driven solutions.">
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>

<body>
  <div id="root">
    <style>
      @keyframes pulse {

        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.5;
        }
      }

      .loading-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
    <div
      style="min-height: 100vh; background-color: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif;">
      <h1
        style="font-size: 3rem; font-weight: bold; margin-bottom: 1rem; background: linear-gradient(to right, #60a5fa, #22d3ee); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
        Gunasree's Portfolio</h1>
      <p style="font-size: 1.5rem; color: #94a3b8;">AI & Data Innovator</p>
      <p class="loading-pulse" style="margin-top: 2rem; opacity: 0.7;">Loading...</p>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
